# DHCP only for the USB gadget link; DNS forwarding is not needed there.
port=0

interface=usb0
bind-dynamic

# Hand out the host-side address expected by the existing SSH workflow.
dhcp-range=192.168.7.1,192.168.7.1,255.255.255.0,12h

dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq-usb.leases
